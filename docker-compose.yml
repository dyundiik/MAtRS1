services:
  frontend:
    build: ./frontend
    container_name: tripack-frontend
    ports:
      - "8080:80"
    depends_on:
      - gateway
    networks: [tripack-net]
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: tripack-gateway
    ports:
      - "8000:80"
    depends_on:
      auth-service:
        condition: service_healthy
      trip-service:
        condition: service_healthy
      packing-service:
        condition: service_healthy
    networks: [tripack-net]
    restart: unless-stopped

  auth-service:
    build: ./services/auth
    container_name: tripack-auth
    environment:
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripack}:${POSTGRES_PASSWORD:-tripack_dev_password}@postgres:5432/auth_db
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-tripack}:${RABBITMQ_DEFAULT_PASS:-tripack_mq_password}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [tripack-net]
    restart: unless-stopped

  trip-service:
    build: ./services/trip
    container_name: tripack-trip
    environment:
      SERVICE_NAME: trip-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripack}:${POSTGRES_PASSWORD:-tripack_dev_password}@postgres:5432/trip_db
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-tripack}:${RABBITMQ_DEFAULT_PASS:-tripack_mq_password}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [tripack-net]
    restart: unless-stopped

  packing-service:
    build: ./services/packing
    container_name: tripack-packing
    environment:
      SERVICE_NAME: packing-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripack}:${POSTGRES_PASSWORD:-tripack_dev_password}@postgres:5432/packing_db
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-tripack}:${RABBITMQ_DEFAULT_PASS:-tripack_mq_password}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [tripack-net]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: tripack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripack_dev_password}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripack} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tripack-net]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tripack-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-tripack}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-tripack_mq_password}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tripack-net]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tripack-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - trip-service
      - packing-service
    networks: [tripack-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: tripack-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_dev_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [tripack-net]
    restart: unless-stopped

networks:
  tripack-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
