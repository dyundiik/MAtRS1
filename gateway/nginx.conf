server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location /api/auth/ {
        proxy_pass http://auth-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/trips/ {
        proxy_pass http://trip-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/packing/ {
        proxy_pass http://packing-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        default_type application/json;
        return 200 '{"service":"TripPack API Gateway","routes":["/api/auth/","/api/trips/","/api/packing/"]}';
    }
}
